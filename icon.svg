<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Daily Report">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161C28"/>
      <stop offset="1" stop-color="#0E1116"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD873"/>
      <stop offset="1" stop-color="#F4B942"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5CF0A1"/>
      <stop offset="1" stop-color="#3DDC84"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F4B942" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#F4B942" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3DDC84" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#3DDC84" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232C40"/>
      <stop offset="1" stop-color="#1A2030"/>
    </linearGradient>
    <clipPath id="cardClip">
      <rect x="28" y="24" width="72" height="80" rx="20"/>
    </clipPath>
    <filter id="soft" x="-25%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.40"/>
    </filter>
    <filter id="boxShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Full-bleed background (maskable safe) -->
  <rect width="128" height="128" fill="url(#bg)"/>
  <ellipse cx="102" cy="14" rx="62" ry="48" fill="url(#glow)"/>
  <ellipse cx="20" cy="118" rx="56" ry="44" fill="url(#glow2)"/>

  <!-- Notebook card -->
  <g filter="url(#soft)">
    <rect x="28" y="24" width="72" height="80" rx="20" fill="url(#card)"/>
    <rect x="28.75" y="24.75" width="70.5" height="78.5" rx="19.25" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="1.5"/>
  </g>

  <!-- Gold header with binding holes -->
  <g clip-path="url(#cardClip)">
    <rect x="28" y="24" width="72" height="21" fill="url(#gold)"/>
    <rect x="28" y="40" width="72" height="5" fill="#000000" opacity="0.06"/>
    <circle cx="46" cy="34.5" r="3.2" fill="#0E1116" opacity="0.85"/>
    <circle cx="64" cy="34.5" r="3.2" fill="#0E1116" opacity="0.85"/>
    <circle cx="82" cy="34.5" r="3.2" fill="#0E1116" opacity="0.85"/>
  </g>

  <!-- Checklist rows -->
  <g filter="url(#boxShadow)">
    <rect x="39" y="53" width="13" height="13" rx="4" fill="url(#green)"/>
    <rect x="39" y="72" width="13" height="13" rx="4" fill="url(#gold)"/>
  </g>
  <path d="M41.9 59.6l2.4 2.5 4.2-5.2" fill="none" stroke="#052013" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M41.9 78.6l2.4 2.5 4.2-5.2" fill="none" stroke="#2A1E02" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="39" y="91" width="13" height="13" rx="4" fill="none" stroke="#8B95A8" stroke-opacity="0.55" stroke-width="1.8"/>

  <rect x="59" y="56.5" width="31" height="6" rx="3" fill="#8B95A8" opacity="0.62"/>
  <rect x="59" y="75.5" width="31" height="6" rx="3" fill="#8B95A8" opacity="0.62"/>
  <rect x="59" y="94.5" width="22" height="6" rx="3" fill="#8B95A8" opacity="0.38"/>
</svg>
