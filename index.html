<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#0E1116" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Daily Report" />
    <meta name="description" content="Track daily habits, tasks, and score points every day." />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Daily Report</title>
    <style>
      html, body {
        margin: 0;
        min-height: 100%;
        background: #0e1116;
        color: #f4f1ea;
        font-family: Outfit, system-ui, sans-serif;
      }
      #app:empty::before {
        content: "Loading Daily Report...";
        display: block;
        padding: 48px 20px;
        text-align: center;
        color: #8b95a8;
      }
      #boot-error {
        display: none;
        max-width: 480px;
        margin: 0 auto;
        padding: 48px 20px;
        text-align: center;
        color: #f4f1ea;
      }
      #boot-error p { color: #8b95a8; font-size: 14px; line-height: 1.5; }
      #boot-error-detail {
        margin-top: 12px;
        font-size: 12px;
        word-break: break-all;
        color: #ff6b7a;
      }
      #boot-error button {
        margin-top: 16px;
        background: #f4b942;
        color: #1a1404;
        border: 0;
        border-radius: 14px;
        padding: 12px 18px;
        font-weight: 700;
      }
    </style>
    <script>
      // If the module bundle fails (e.g. stale cache or wrong base path on
      // GitHub Pages), #app stays empty forever. Show a real error instead.
      window.addEventListener('DOMContentLoaded', function () {
        setTimeout(function () {
          var app = document.getElementById('app')
          var err = document.getElementById('boot-error')
          if (app && !app.hasChildNodes() && err) {
            err.style.display = 'block'
            var detail = document.getElementById('boot-error-detail')
            var reason = app.getAttribute('data-boot-failed')
            if (detail && reason) detail.textContent = 'Details: ' + reason
          }
        }, 6000)
      })
      window.addEventListener('error', function (e) {
        var app = document.getElementById('app')
        if (app && !app.hasChildNodes()) {
          var info = (e && e.message) || 'load error'
          if (e && e.target && e.target.src) info += ' :: ' + e.target.src
          app.setAttribute('data-boot-failed', String(info))
        }
      }, true)
    </script>
    <script type="module" crossorigin src="./assets/index-D7JQVfew.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BCAPsosc.css">
  </head>
  <body>
    <div id="app"></div>
    <div id="boot-error">
      <h2 style="font-size:20px;margin:0 0 8px">Could not load Daily Report</h2>
      <p>The app files failed to load (Error A: startup script did not run). This is usually a stale installed copy: remove the home-screen app, clear site data for this site, then reinstall from the browser.</p>
      <p id="boot-error-detail"></p>
      <button type="button" onclick="window.location.reload(true)">Reload</button>
    </div>
    <noscript><p style="text-align:center;color:#8b95a8">Daily Report needs JavaScript enabled.</p></noscript>
  </body>
</html>
